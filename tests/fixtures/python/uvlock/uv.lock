version = 1
requires-python = ">=3.11"

[[package]]
name = "example-app"
version = "1.0.0"
source = { editable = "." }
dependencies = [
    { name = "httpx" },
]

[package.optional-dependencies]
dev = [
    { name = "pytest" },
    { name = "coverage" },
]

[[package]]
name = "httpx"
version = "0.27.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "anyio" },
    { name = "certifi" },
]

[[package]]
name = "anyio"
version = "4.4.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "idna" },
]

[[package]]
name = "certifi"
version = "2024.7.4"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "idna"
version = "3.7"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pytest"
version = "8.3.2"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "pluggy" },
]

[[package]]
name = "pluggy"
version = "1.5.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "coverage"
version = "7.6.0"
source = { registry = "https://pypi.org/simple" }

[package.optional-dependencies]
toml = [
    { name = "tomli" },
]

[[package]]
name = "tomli"
version = "2.0.1"
source = { registry = "https://pypi.org/simple" }
