# Keeps the SHA-pinned actions and Python dependencies current.
#
# Every ecosystem waits a week before a new release is proposed. A compromised
# release is usually caught and yanked within days, so opening a PR the hour one
# is published puts us in exactly the window this tool exists to warn other
# people about. Security updates ignore the cooldown, so a real advisory still
# arrives immediately.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # uv (not pip): the project's Python deps live in pyproject.toml/uv.lock, and
  # the pip ecosystem would also pick up the manifests under tests/fixtures/,
  # which are test data pinned to deliberately vulnerable versions.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
