name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to a branch makes the first run's answer irrelevant, and the
# self-scan job talks to the live OSV API — no reason to ask it twice. Runs on
# main are never cancelled, so the default branch keeps a complete history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      # Our own CI is part of our supply chain, and a workflow is the one place
      # in this repository that runs with a token. Pinned like everything else:
      # an unpinned audit tool can start failing the build on a release we never
      # chose to take.
      - name: Zizmor
        run: uvx zizmor@1.28.0 --no-online-audits .github/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --extra dev pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build wheel and sdist
        run: uv build
      - name: Verify the console script is installable and runs
        run: |
          uv tool install --from dist/*.whl icebergsca
          icebergsca --version
      # The agent skill lives in a dot-directory. If packaging ever stops bundling
      # it the tool keeps working and consuming agents silently lose their guidance,
      # so it is checked explicitly rather than assumed.
      - name: Verify the agent skill is bundled
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          skill = [n for n in names if "/.agents/skills/" in n]
          assert any(n.endswith("SKILL.md") for n in skill), "SKILL.md missing from wheel"
          assert any("references/" in n for n in skill), "skill references missing"
          print(f"ok: {len(skill)} skill files bundled")
          PY

  # Dogfooding. IcebergSCA scans its own dependencies on every run, which is both a
  # genuine supply chain check and an end-to-end test against the live OSV API — the
  # one thing the offline unit suite deliberately cannot cover.
  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # A fork PR gets a read-only token regardless, so the upload fails there
      # rather than granting anything.
      security-events: write # required by upload-sarif, below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Scan our own dependencies
        run: uv run icebergsca scan . --exclude 'tests/fixtures/**' --no-color
      - name: Produce SARIF
        if: always()
        run: |
          uv run icebergsca scan . \
            --exclude 'tests/fixtures/**' \
            --format sarif --output icebergsca.sarif
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        with:
          sarif_file: icebergsca.sarif
          category: icebergsca
